<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBO | Blog - Coolest Young Brain Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="icon" type="image/png" href="https://i.imgur.com/nrOMBEp.png">
    <link rel="stylesheet" href="blog.css">
</head>
<body class="bg-black text-white font-sans">

    <!-- TOP NAVIGATION BAR -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10 py-4 px-6 md:px-10">
        <div class="max-w-[1440px] mx-auto flex items-center justify-between gap-4">
            
            <!-- LEFT: Back Button -->
            <a href="/" id="back-btn" class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-white/10 transition-colors md:w-12 md:h-12">
                <iconify-icon icon="lucide:arrow-left" class="text-xl md:text-2xl"></iconify-icon>
            </a>

            <!-- CENTER: Logo -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <img src="https://i.imgur.com/nrOMBEp.png" class="w-8 h-8 md:w-10 md:h-10 rounded-lg shadow-lg shadow-cyan-500/20" alt="CYBO Logo">
                <span class="font-display font-black text-lg md:text-2xl tracking-tighter">CYBO BLOG</span>
            </div>

            <!-- RIGHT: Search & Filter -->
            <div class="flex items-center gap-2 md:gap-4 flex-1 md:flex-initial">
                <div class="flex-1 md:flex-initial relative">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search posts..." 
                        class="w-full px-4 py-2 md:px-4 md:py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/40 text-xs md:text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/10 transition-all"
                    >
                    <iconify-icon icon="lucide:search" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 text-lg pointer-events-none"></iconify-icon>
                </div>
                
                <button id="filter-toggle" class="p-2 md:p-2.5 rounded-lg hover:bg-white/10 transition-colors flex items-center justify-center">
                    <iconify-icon icon="lucide:filter" class="text-xl md:text-2xl"></iconify-icon>
                </button>
            </div>
        </div>
    </nav>

    <!-- CATEGORY FILTER BAR -->
    <div class="fixed top-16 md:top-[72px] left-0 w-full z-40 bg-black/60 backdrop-blur-md border-b border-white/5 overflow-x-auto scrollbar-hide">
        <div class="max-w-[1440px] mx-auto px-6 md:px-10 py-3 flex gap-2 md:gap-3 whitespace-nowrap">
            <button class="category-btn active px-4 py-1.5 rounded-full bg-cyan-500 text-black font-bold text-xs md:text-sm transition-all" data-category="all">
                All
            </button>
            <button class="category-btn px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs md:text-sm transition-all" data-category="physics">
                Physics
            </button>
            <button class="category-btn px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs md:text-sm transition-all" data-category="tech">
                Tech
            </button>
            <button class="category-btn px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs md:text-sm transition-all" data-category="cycling">
                Cycling
            </button>
            <button class="category-btn px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs md:text-sm transition-all" data-category="music">
                Music
            </button>
            <button class="category-btn px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs md:text-sm transition-all" data-category="travel">
                Travel
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="pt-32 md:pt-40 px-6 md:px-10 pb-20">
        <div class="max-w-[1440px] mx-auto">
            
            <!-- HEADER -->
            <div class="mb-12">
                <h1 class="font-display font-black text-4xl md:text-6xl mb-4 uppercase">
                    <span class="gradient-text-cyan">Blog</span> & Insights
                </h1>
                <p class="text-white/60 text-sm md:text-lg max-w-2xl">
                    Thoughts on physics, technology, cycling, and the intersection of curiosity and creation.
                </p>
            </div>

            <!-- BLOG GRID (MASONRY) -->
            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                <!-- Blog cards will be dynamically inserted here -->
                <div class="col-span-full flex items-center justify-center py-20">
                    <p class="text-white/40">Loading posts...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ARTICLE MODAL/POPUP -->
    <div id="article-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm overflow-y-auto">
        <div class="min-h-screen py-10 px-6 md:px-10">
            <div class="max-w-6xl mx-auto">
                
                <!-- CLOSE BUTTON -->
                <button id="modal-close" class="absolute top-10 right-10 p-2 rounded-lg hover:bg-white/10 transition-colors">
                    <iconify-icon icon="lucide:x" class="text-3xl"></iconify-icon>
                </button>

                <!-- MODAL CONTENT GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-10 mt-10">
                    
                    <!-- LEFT: ARTICLE CONTENT -->
                    <div class="lg:col-span-2 order-2 lg:order-1">
                        <div id="modal-article" class="prose prose-invert max-w-none">
                            <!-- Article content inserted here -->
                        </div>
                    </div>

                    <!-- RIGHT: VIDEO & SOURCES -->
                    <div class="lg:col-span-1 order-1 lg:order-2">
                        
                        <!-- VIDEO COMPANION -->
                        <div id="modal-video-section" class="mb-10">
                            <h3 class="font-display font-black text-2xl mb-4 uppercase">Video</h3>
                            <div id="modal-video" class="w-full aspect-video rounded-xl overflow-hidden bg-black border border-white/10">
                                <!-- Video thumbnail or embed inserted here -->
                            </div>
                        </div>

                        <!-- SOURCES -->
                        <div id="modal-sources-section">
                            <h3 class="font-display font-black text-2xl mb-4 uppercase">Sources</h3>
                            <div id="modal-sources" class="space-y-3">
                                <!-- Sources inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="blogs.js"></script>
    <script src="blog.js"></script>
</body>
</html>
